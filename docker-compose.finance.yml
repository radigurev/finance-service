# Finance services. Attaches to the shared `platform_net` network created by
# the Warehouse `docker-compose.platform.yml` stack (SQL Server, RabbitMQ,
# Redis, Loki, Grafana, Jaeger).
#
# Prerequisites:
#   1. `docker network create platform_net` (if not already created)
#   2. The Warehouse platform stack is running:
#        docker compose -f ../Warehouse/docker-compose.platform.yml up -d
#   3. The auth-service stack is running:
#        docker compose -f ../auth-service/docker-compose.yml up -d
#   4. Every service has a real `appsettings.json`. Only `*.json.template` files
#      are tracked (CLAUDE.md 0.1), and there is no `.dockerignore`, so the build
#      context picks up the untracked `appsettings.json` you create next to each
#      template. Copy each `appsettings.json.template` to `appsettings.json`
#      before building. The environment variables below override every
#      environment-specific `<PLACEHOLDER>` in those files; the files still supply
#      the structural config the env vars cannot express — above all the gateway's
#      `ReverseProxy:Routes` table, which has no environment-variable form here.
#
# Then bring Finance up:
#   docker compose -f docker-compose.finance.yml up -d --build
#
# ---------------------------------------------------------------------------
# Startup prerequisites that `depends_on` CANNOT express
# ---------------------------------------------------------------------------
# `depends_on` below is the plain list form: it orders container START only. It
# does NOT wait for a container to become healthy, nor for its EF Core migration
# to finish. Each service applies its own migrations at startup via
# `db.Database.MigrateAsync()`. Two ordering obligations therefore remain manual
# (CHG-ENH-003 11):
#
#   1. MIGRATION ORDER. `finance-journal-api` MUST have applied
#      `20260805174405_AddJournalEntrySourceDocument` to `finance_journal`, and
#      `finance-invoices-api` MUST have applied `20260805182742_AddInvoiceSettlement`
#      to `finance_invoices`, BEFORE `finance-payments-api` publishes its first
#      `PaymentConfirmedEvent`. Against an unmigrated `finance_journal` the
#      Journal-side `PaymentConfirmedEventConsumer` faults and dead-letters to
#      `finance-journal_error`. On a cold start bring Journal and Invoices up
#      first, confirm their migrations applied, then start Payments:
#        docker compose -f docker-compose.finance.yml up -d finance-journal-api finance-invoices-api
#        docker compose -f docker-compose.finance.yml up -d
#
#   2. RBAC SEEDING. The eight Payments permissions
#      (`finance.payment:read|create|confirm|post|cancel|reverse|allocate` and
#      `finance.aging:read`) exist only in the shipped `[RequirePermission]`
#      attributes. Permission auto-registration is DEFERRED (SDD-INT-AUTH-001 2.4),
#      so they MUST be seeded MANUALLY in auth-service and granted to roles.
#      Until that is done EVERY one of the fifteen Payments endpoints returns
#      403 INSUFFICIENT_PERMISSIONS for every caller while the service reports
#      healthy. Do NOT collapse them into a `finance.payment:*` wildcard grant:
#      `finance.aging:read` MUST stay unaliased (CHG-ENH-003 4.1 rule 1).
#
#   3. POSTING RULES. `FeatureManagement__EnablePostingRuleSeeding` is `false`
#      below, matching the template. Until it is enabled (after accountant
#      sign-off on the account codes) a confirmed payment's journal post fails
#      with POSTING_RULE_NOT_FOUND and the payment stays `Confirmed` and unlinked
#      (CHG-ENH-003 11).

services:
  finance-accounts-api:
    image: finance-accounts-api:dev
    container_name: finance-accounts-api
    build:
      context: .
      dockerfile: src/Interfaces/Accounts/Finance.Accounts.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6001
      ConnectionStrings__FinanceAccountsDb: "Server=platform-sqlserver,1433;Database=finance_accounts;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Country__Code: "BG"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6001:6001"
    networks:
      - platform_net

  finance-periods-api:
    image: finance-periods-api:dev
    container_name: finance-periods-api
    build:
      context: .
      dockerfile: src/Interfaces/Periods/Finance.Periods.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6002
      ConnectionStrings__FinancePeriodsDb: "Server=platform-sqlserver,1433;Database=finance_periods;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Country__Code: "BG"
      Country__BaseCurrency: "BGN"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6002:6002"
    networks:
      - platform_net

  finance-nomenclature-api:
    image: finance-nomenclature-api:dev
    container_name: finance-nomenclature-api
    build:
      context: .
      dockerfile: src/Interfaces/Nomenclature/Finance.Nomenclature.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6009
      ConnectionStrings__FinanceNomenclatureDb: "Server=platform-sqlserver,1433;Database=finance_nomenclature;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Warehouse__NomenclatureBaseUrl: "${WAREHOUSE_GATEWAY_BASE_URL:-http://warehouse-gateway:5000}"
      FeatureManagement__EnableCurrencySeeding: "false"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6009:6009"
    networks:
      - platform_net

  finance-eventlog-api:
    image: finance-eventlog-api:dev
    container_name: finance-eventlog-api
    build:
      context: .
      dockerfile: src/Infrastructure/EventLog/Finance.EventLog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6008
      ConnectionStrings__FinanceEventLogDb: "Server=platform-sqlserver,1433;Database=finance_eventlog;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      EventLog__RetentionDays: "90"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6008:6008"
    networks:
      - platform_net

  # Ordering obligation 1: Journal owns `20260805174405_AddJournalEntrySourceDocument`
  # and MUST be migrated before Payments publishes (CHG-ENH-003 11 step 1).
  finance-journal-api:
    image: finance-journal-api:dev
    container_name: finance-journal-api
    build:
      context: .
      dockerfile: src/Interfaces/Journal/Finance.Journal.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6004
      ConnectionStrings__FinanceJournalDb: "Server=platform-sqlserver,1433;Database=finance_journal;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Country__Code: "BG"
      Country__BaseCurrency: "BGN"
      Gateway__BaseUrl: "http://finance-gateway:6000"
      FeatureManagement__EnablePostingRuleSeeding: "false"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6004:6004"
    networks:
      - platform_net

  # Ordering obligation 1 (cont.): Invoices owns `20260805182742_AddInvoiceSettlement`
  # and MUST be migrated before any allocation event lands (CHG-ENH-003 11 step 2).
  finance-invoices-api:
    image: finance-invoices-api:dev
    container_name: finance-invoices-api
    build:
      context: .
      dockerfile: src/Interfaces/Invoices/Finance.Invoices.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6005
      ConnectionStrings__FinanceInvoicesDb: "Server=platform-sqlserver,1433;Database=finance_invoices;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Country__Code: "BG"
      Country__BaseCurrency: "BGN"
      Gateway__BaseUrl: "http://finance-gateway:6000"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6005:6005"
    depends_on:
      - finance-journal-api
    networks:
      - platform_net

  # Starts last of the domain services: its `PaymentConfirmedEvent` is what the
  # Journal and Invoices migrations above must already be in place for.
  finance-payments-api:
    image: finance-payments-api:dev
    container_name: finance-payments-api
    build:
      context: .
      dockerfile: src/Interfaces/Payments/Finance.Payments.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6006
      ConnectionStrings__FinancePaymentsDb: "Server=platform-sqlserver,1433;Database=finance_payments;User Id=sa;Password=Warehouse@Dev123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "platform-redis:6379"
      RabbitMQ__Host: "platform-rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
      OpenTelemetry__OtlpEndpoint: "http://platform-jaeger:4317"
      Country__Code: "BG"
      Country__BaseCurrency: "BGN"
      Gateway__BaseUrl: "http://finance-gateway:6000"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_LOCAL_DEV_SECRET_KEY_32CHARS_MIN}"
      Jwt__Issuer: "Warehouse.Auth.API"
      Jwt__Audience: "Warehouse"
      PermissionValidation__AuthApiBaseAddress: "http://warehouse-auth-api:5001"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6006:6006"
    depends_on:
      - finance-journal-api
      - finance-invoices-api
    networks:
      - platform_net

  # Every `HealthChecks:*` value and every `ReverseProxy:Clusters:*` destination
  # address MUST be an absolute URI or GatewayConfigurationValidator aborts
  # startup (SDD-INFRA-002 3.1). All eight of each are therefore overridden here,
  # replacing the `<*_API_URL>` placeholders that ship in the template.
  finance-gateway:
    image: finance-gateway:dev
    container_name: finance-gateway
    build:
      context: .
      dockerfile: src/Infrastructure/Gateway/Finance.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6000
      HealthChecks__AuthApi: "http://warehouse-auth-api:5001"
      HealthChecks__AccountsApi: "http://finance-accounts-api:6001"
      HealthChecks__NomenclatureApi: "http://finance-nomenclature-api:6009"
      HealthChecks__EventLogApi: "http://finance-eventlog-api:6008"
      HealthChecks__JournalApi: "http://finance-journal-api:6004"
      HealthChecks__InvoicesApi: "http://finance-invoices-api:6005"
      HealthChecks__PeriodsApi: "http://finance-periods-api:6002"
      HealthChecks__PaymentsApi: "http://finance-payments-api:6006"
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-api__Address: "http://warehouse-auth-api:5001"
      ReverseProxy__Clusters__accounts-cluster__Destinations__accounts-api__Address: "http://finance-accounts-api:6001"
      ReverseProxy__Clusters__nomenclature-cluster__Destinations__nomenclature-api__Address: "http://finance-nomenclature-api:6009"
      ReverseProxy__Clusters__eventlog-cluster__Destinations__eventlog-api__Address: "http://finance-eventlog-api:6008"
      ReverseProxy__Clusters__journal-cluster__Destinations__journal-api__Address: "http://finance-journal-api:6004"
      ReverseProxy__Clusters__invoices-cluster__Destinations__invoices-api__Address: "http://finance-invoices-api:6005"
      ReverseProxy__Clusters__periods-cluster__Destinations__periods-api__Address: "http://finance-periods-api:6002"
      ReverseProxy__Clusters__payments-cluster__Destinations__payments-api__Address: "http://finance-payments-api:6006"
      LOKI_ENDPOINT: "http://platform-loki:3100"
    ports:
      - "6000:6000"
    depends_on:
      - finance-accounts-api
      - finance-periods-api
      - finance-nomenclature-api
      - finance-eventlog-api
      - finance-journal-api
      - finance-invoices-api
      - finance-payments-api
    networks:
      - platform_net

  finance-frontend:
    image: finance-frontend:dev
    container_name: finance-frontend
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:6000/api/v1"
    ports:
      - "6100:6100"
    depends_on:
      - finance-gateway
    networks:
      - platform_net

networks:
  platform_net:
    name: platform_net
    external: true
